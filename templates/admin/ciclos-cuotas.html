<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Ciclos de Cuotas - Sistema Bomberos</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/global-profesional.css' %}">
    <link rel="stylesheet" href="{% static 'css/tema-bomberil.css' %}">
    <style>
        .ciclos-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
        }

        .dashboard-activo {
            background: linear-gradient(135deg, #0d1f14, #0a1a10);
            border: 2px solid rgba(39,174,96,0.4);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .dashboard-activo h2 {
            color: #4ade80;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .estadisticas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #1c1c1c;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            border: 1px solid #2a2a2a;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #c41e3a;
            margin: 10px 0;
        }

        .stat-label {
            color: #888;
            font-size: 0.9rem;
        }

        .progress-ring {
            width: 150px;
            height: 150px;
            margin: 20px auto;
        }

        .ciclo-card {
            background: #1c1c1c;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .ciclo-card.cerrado {
            opacity: 0.7;
            background: #161616;
        }

        .ciclo-card:hover {
            border-color: #c41e3a;
            box-shadow: 0 4px 15px rgba(196, 30, 58, 0.2);
        }

        .ciclo-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .ciclo-nombre {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f0f0f0;
        }

        .badges {
            display: flex;
            gap: 10px;
        }

        .badge {
            padding: 6px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .badge-activo {
            background: #4caf50;
            color: white;
        }

        .badge-inactivo {
            background: #ff9800;
            color: white;
        }

        .badge-cerrado {
            background: #9e9e9e;
            color: white;
        }

        .ciclo-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            padding: 15px;
            background: #161616;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
        }

        .info-label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f0f0f0;
        }

        .ciclo-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: #2196f3;
            color: white;
        }

        .btn-primary:hover {
            background: #1976d2;
        }

        .btn-success {
            background: #4caf50;
            color: white;
        }

        .btn-success:hover {
            background: #388e3c;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #d32f2f;
        }

        .btn-secondary {
            background: #757575;
            color: white;
        }

        .btn-secondary:hover {
            background: #616161;
        }

        .btn-nuevo {
            background: #c41e3a;
            color: white;
            padding: 15px 30px;
            font-size: 1.1rem;
            margin-bottom: 30px;
            display: inline-block;
        }

        .btn-nuevo:hover {
            background: #8b0000;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1c1c1c;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #2a2a2a;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            margin: 0;
            color: #c41e3a;
        }

        .close-modal {
            font-size: 2rem;
            cursor: pointer;
            color: #888;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #999;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background: #1a1a1a;
            color: #f0f0f0;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #c41e3a;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-success {
            background: rgba(39,174,96,0.12);
            color: #4ade80;
            border: 1px solid rgba(39,174,96,0.3);
        }

        .alert-error {
            background: rgba(192,57,43,0.12);
            color: #fca5a5;
            border: 1px solid rgba(192,57,43,0.3);
        }

        .alert-warning {
            background: rgba(200,148,42,0.12);
            color: #fcd34d;
            border: 1px solid rgba(200,148,42,0.3);
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #2a2a2a;
            color: #ccc;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }

        .back-btn:hover {
            background: #333;
            color: #fff;
        }
    </style>
    <link rel="stylesheet" href="{% static 'css/global-dark.css' %}?v=2">
    <link rel="stylesheet" href="{% static 'css/tesoreria-dark.css' %}?v=6">
</head>
<body>
    <div class="ciclos-container">
        <a href="/sistema.html" class="back-btn">← Volver al Sistema</a>

        <div class="header">
            <h1>Administracion de Ciclos de Cuotas</h1>
            <p>Gestiona los periodos anuales de cobro de cuotas sociales</p>
        </div>

        <div id="alertContainer"></div>

        <button class="btn btn-nuevo" onclick="abrirModalNuevoCiclo()">
            + Crear Nuevo Ciclo
        </button>

        <!-- Dashboard del Ciclo Activo -->
        <div id="dashboardActivo" class="dashboard-activo" style="display: none;">
            <h2>Ciclo Activo: <span id="cicloActivoAnio"></span></h2>
            
            <div class="estadisticas-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Pagos</div>
                    <div class="stat-value" id="statTotalPagos">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Recaudado</div>
                    <div class="stat-value" id="statTotalRecaudado">$0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Voluntarios Pagaron</div>
                    <div class="stat-value" id="statVoluntariosPagaron">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">% Cumplimiento</div>
                    <div class="stat-value" id="statPorcentaje">0%</div>
                </div>
            </div>
        </div>

        <!-- Lista de Ciclos -->
        <div id="listaCiclos" class="loading">
            <div class="spinner"></div>
            <p>Cargando ciclos...</p>
        </div>
    </div>

    <!-- Modal Crear/Editar Ciclo -->
    <div id="modalCiclo" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitulo">Crear Nuevo Ciclo</h2>
                <span class="close-modal" onclick="cerrarModal()">&times;</span>
            </div>

            <form id="formCiclo" onsubmit="guardarCiclo(event)">
                <div class="form-group">
                    <label for="anio">Año *</label>
                    <input type="number" id="anio" name="anio" required min="2020" max="2100">
                </div>

                <div class="form-group">
                    <label for="fecha_inicio">Fecha Inicio *</label>
                    <input type="date" id="fecha_inicio" name="fecha_inicio" required>
                </div>

                <div class="form-group">
                    <label for="fecha_fin">Fecha Fin *</label>
                    <input type="date" id="fecha_fin" name="fecha_fin" required>
                </div>

                <div class="form-group">
                    <label for="precio_cuota_regular">Precio Cuota Regular ($) *</label>
                    <input type="number" id="precio_cuota_regular" name="precio_cuota_regular" required min="0" step="100" placeholder="5000">
                </div>

                <div class="form-group">
                    <label for="precio_cuota_estudiante">Precio Cuota Estudiante ($)</label>
                    <input type="number" id="precio_cuota_estudiante" name="precio_cuota_estudiante" required min="0" step="100" placeholder="3000">
                </div>

                <div class="form-group">
                    <label for="observaciones">Observaciones</label>
                    <textarea id="observaciones" name="observaciones"></textarea>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="activo" name="activo" checked>
                        Marcar como ciclo activo
                    </label>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn btn-success">Guardar Ciclo</button>
                </div>
            </form>
        </div>
    </div>

    <script src="{% static 'js/admin-ciclos-cuotas.js' %}?v=3.0"></script>
</body>
</html>
