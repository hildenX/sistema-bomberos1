{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Asistencia | Proyecto 6</title>
    <link rel="stylesheet" href="{% static 'css/asistencias-cargos.css' %}?v=2">
    <link rel="stylesheet" href="{% static 'css/global-dark.css' %}?v=4">
    <style>
        body {
            background: #0e0e0e;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-detalle {
            background: #1c1c1c;
            border-radius: 20px;
            padding: 35px 40px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            border: 1px solid #2a2a2a;
        }

        .header-detalle::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #c0392b 0%, #8b1429 100%);
        }

        .header-detalle h1 {
            margin: 0 0 15px 0;
            color: #f0f0f0;
            font-size: 2.5em;
            font-weight: 700;
        }
        
        .info-principal {
            background: #161616;
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
            border: 1px solid #2a2a2a;
        }
        
        .info-row {
            display: grid;
            grid-template-columns: 150px 1fr 150px 1fr;
            gap: 20px 30px;
            padding: 12px 0;
            border-bottom: 1px solid #2a2a2a;
            align-items: center;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-row.full-width {
            grid-template-columns: 150px 1fr;
        }
        
        .info-label {
            color: #e74c3c;
            font-weight: 700;
            font-size: 0.95em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-value {
            color: #f0f0f0;
            font-size: 1.05em;
            font-weight: 500;
        }

        .info-value strong {
            color: #e74c3c;
            font-weight: 700;
        }

        .info-value-small {
            color: #666;
            font-size: 0.85em;
            margin-top: 3px;
            font-style: italic;
        }
        
        .seccion-asistentes {
            background: #1c1c1c;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
        }

        .seccion-asistentes h2 {
            margin: 0 0 25px 0;
            color: #f0f0f0;
            border-bottom: 3px solid #c0392b;
            padding-bottom: 15px;
            font-size: 1.8em;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .categoria-grupo {
            margin-bottom: 30px;
        }
        
        .categoria-titulo {
            background: linear-gradient(135deg, #c0392b 0%, #8b1429 100%);
            color: white;
            padding: 18px 25px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 15px;
        }
        
        .asistentes-lista {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .asistente-item {
            background: #161616;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            border-left: 4px solid #c0392b;
            border: 1px solid #2a2a2a;
            border-left: 4px solid #c0392b;
        }

        .asistente-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 16px rgba(192,57,43,0.2);
        }

        .asistente-nombre {
            font-weight: 700;
            color: #f0f0f0;
            margin-bottom: 8px;
            font-size: 1.05em;
        }

        .asistente-cargo {
            color: #e74c3c;
            font-size: 0.9em;
            margin-top: 5px;
            padding-left: 5px;
            border-left: 2px solid #c0392b;
        }
        
        .btn-volver {
            background: #2a2a2a;
            color: #ccc;
            border: 1px solid #333;
            padding: 15px 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .btn-volver:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-detalle">
            <h1 id="tituloAsistencia">Detalle de Asistencia</h1>
            <div class="info-principal" id="infoPrincipal">
                <!-- Se llena dinámicamente -->
            </div>
        </div>
        
        <div class="seccion-asistentes">
            <h2>Asistentes Registrados</h2>
            <div id="contenidoAsistentes">
                <!-- Se llena dinámicamente -->
            </div>
        </div>
        
        <div style="text-align: center;">
            <button class="btn-volver" onclick="window.history.back()">
                ← Volver
            </button>
        </div>
    </div>
    
    <script src="{% static 'js/auth_django.js' %}"></script>
    <script src="{% static 'js/utils.js' %}"></script>
    <script src="{% static 'js/claves-radiales.js' %}"></script>
    <script src="{% static 'js/detalle-asistencia-django.js' %}?v=10.0"></script>
    <script>console.log('Detalle Asistencia v10.0 - HORAS SIEMPRE VISIBLES');</script>
