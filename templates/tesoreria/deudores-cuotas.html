{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deudores de cuotas sociales</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/deudores-sobrio.css' %}?v=2">
</head>
<body>
<main class="dd">
    <header class="dd-head">
        <div>
            <h1>Deudores de cuotas sociales</h1>
            <p id="ddSubtitulo">Voluntarios activos con cuotas vencidas, del más antiguo al más nuevo.</p>
        </div>
        <div class="dd-head-acc">
            <select id="ddAnio" class="dd-anio" aria-label="Año"></select>
            <a id="btnPDF" class="dd-btn is-pri" href="#" target="_blank" rel="noopener">Descargar PDF</a>
            <a class="dd-btn is-ghost" href="/sistema.html">Volver</a>
        </div>
    </header>

    <section class="dd-resumen" id="ddResumen" hidden>
        <div><span>Deudores</span><b id="ddTotalDeudores">0</b></div>
        <div><span>Deuda total</span><b id="ddTotalDeuda">$0</b></div>
        <div class="dd-chips" id="ddChips"></div>
    </section>

    <div class="dd-toolbar">
        <input id="ddBuscar" type="search" placeholder="Buscar por nombre o clave" aria-label="Buscar deudor" autocomplete="off">
        <select id="ddTramo" aria-label="Filtrar por meses adeudados">
            <option value="">Todos los deudores</option>
            <option value="1-2">Deben 1 a 2 meses</option>
            <option value="3-5">Deben 3 a 5 meses</option>
            <option value="6-12">Deben 6 meses o más</option>
        </select>
        <span id="ddContador" class="dd-contador"></span>
    </div>

    <div class="dd-tabla-caja">
        <div id="ddEstado" class="dd-estado">Cargando deudores…</div>
        <table id="ddTabla" hidden>
            <thead>
                <tr>
                    <th class="dd-num">N°</th>
                    <th>Clave</th>
                    <th>Voluntario</th>
                    <th>Meses adeudados</th>
                    <th class="dd-der">Deuda</th>
                </tr>
            </thead>
            <tbody id="ddFilas"></tbody>
        </table>
    </div>
</main>

<script>
(function () {
    const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
    const TRAMOS = { '1-2': [1, 2], '3-5': [3, 5], '6-12': [6, 12] };
    let deudores = [];
    const $ = (id) => document.getElementById(id);
    const pesos = (n) => '$' + Math.round(n).toLocaleString('es-CL');
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    // Ignora mayúsculas y tildes al buscar
    const norm = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

    // [1,2,3,5,6] -> "Ene a Mar, May a Jun"
    function rangos(meses) {
        const tramos = [];
        meses.slice().sort((a, b) => a - b).forEach((m) => {
            const ult = tramos[tramos.length - 1];
            if (ult && m === ult[1] + 1) ult[1] = m; else tramos.push([m, m]);
        });
        return tramos.map(([a, b]) => a === b ? MESES[a - 1] : `${MESES[a - 1]} a ${MESES[b - 1]}`).join(', ');
    }

    function pintar() {
        const q = norm($('ddBuscar').value.trim());
        const tramo = TRAMOS[$('ddTramo').value];
        const filas = deudores.filter((d) =>
            (!tramo || (d.cantidad_meses >= tramo[0] && d.cantidad_meses <= tramo[1])) &&
            (!q || norm(`${d.nombre_completo} ${d.clave_bombero}`).includes(q)));

        const total = filas.reduce((s, d) => s + d.monto, 0);
        $('ddContador').textContent = filas.length === deudores.length
            ? `${filas.length} deudores`
            : `${filas.length} de ${deudores.length} deudores · ${pesos(total)}`;

        if (!filas.length) {
            $('ddTabla').hidden = true;
            $('ddEstado').hidden = false;
            $('ddEstado').className = 'dd-estado';
            $('ddEstado').textContent = q ? `Nadie coincide con "${$('ddBuscar').value.trim()}".` : 'No hay deudores en este tramo.';
            return;
        }
        $('ddEstado').hidden = true;
        $('ddTabla').hidden = false;
        $('ddFilas').innerHTML = filas.map((d, i) => `
            <tr>
                <td class="dd-num">${i + 1}</td>
                <td class="dd-clave">${esc(d.clave_bombero)}</td>
                <td class="dd-nombre">${esc(d.nombre_completo)}</td>
                <td><span class="dd-meses">${d.meses && d.meses.length ? rangos(d.meses) : esc(d.meses_pendientes)}</span> <span class="dd-suave">· ${d.cantidad_meses} ${d.cantidad_meses === 1 ? 'mes' : 'meses'}</span></td>
                <td class="dd-der dd-monto">${pesos(d.monto)}</td>
            </tr>`).join('');
    }

    async function cargar() {
        const anio = $('ddAnio').value;
        history.replaceState(null, '', `?anio=${anio}`);
        $('btnPDF').href = `/api/voluntarios/pdf-deudores-cuotas/${anio}/`;
        $('ddResumen').hidden = true;
        $('ddTabla').hidden = true;
        $('ddEstado').hidden = false;
        $('ddEstado').className = 'dd-estado';
        $('ddEstado').textContent = 'Cargando deudores…';
        try {
            const res = await fetch(`/api/voluntarios/deudores-cuotas-listado/?anio=${anio}`, { credentials: 'include' });
            const data = await res.json();
            if (!res.ok || !data.success) throw new Error(data.error || 'No se pudo cargar');
            deudores = data.deudores.map((d) => ({ ...d, monto: Number(d.monto || 0) }));

            if (!deudores.length) {
                $('ddEstado').textContent = `No hay deudores de cuotas en ${anio}. Todos están al día.`;
                $('ddEstado').classList.add('is-ok');
                $('ddContador').textContent = '';
                return;
            }

            $('ddTotalDeudores').textContent = deudores.length;
            $('ddTotalDeuda').textContent = pesos(deudores.reduce((s, d) => s + d.monto, 0));
            $('ddChips').innerHTML = Object.entries(TRAMOS).map(([k, [a, b]]) => {
                const n = deudores.filter((d) => d.cantidad_meses >= a && d.cantidad_meses <= b).length;
                const txt = k === '6-12' ? '6 meses o más' : `${a} a ${b} meses`;
                return n ? `<span>${txt} <b>${n}</b></span>` : '';
            }).join('');
            $('ddResumen').hidden = false;
            pintar();
        } catch (err) {
            $('ddEstado').textContent = 'Error al cargar los deudores: ' + err.message;
        }
    }

    const anioUrl = parseInt(new URLSearchParams(location.search).get('anio'), 10) || new Date().getFullYear();
    const hoy = new Date().getFullYear();
    for (let y = hoy + 1; y >= 2020; y--) {
        $('ddAnio').insertAdjacentHTML('beforeend', `<option value="${y}" ${y === anioUrl ? 'selected' : ''}>${y}</option>`);
    }

    let t;
    $('ddBuscar').addEventListener('input', () => { clearTimeout(t); t = setTimeout(pintar, 150); });
    $('ddTramo').addEventListener('change', pintar);
    $('ddAnio').addEventListener('change', cargar);
    cargar();
})();
</script>
</body>
</html>
