{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deudores de beneficios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/deudores-sobrio.css' %}?v=1">
</head>
<body>
<main class="dd">
    <header class="dd-head">
        <div>
            <h1>Deudores de beneficios</h1>
            <p>Voluntarios con beneficios o rifas pendientes de pago, del más antiguo al más nuevo.</p>
        </div>
        <div class="dd-head-acc">
            <a id="btnPDF" class="dd-btn is-pri" href="/api/voluntarios/pdf-deudores-beneficios/" target="_blank" rel="noopener">Descargar PDF</a>
            <a class="dd-btn is-ghost" href="/sistema.html">Volver</a>
        </div>
    </header>

    <section class="dd-resumen" id="ddResumen" hidden>
        <div><span>Deudores</span><b id="ddTotalDeudores">0</b></div>
        <div><span>Deuda total</span><b id="ddTotalDeuda">$0</b></div>
        <div class="dd-chips" id="ddChips"></div>
    </section>

    <div class="dd-toolbar">
        <input id="ddBuscar" type="search" placeholder="Buscar por nombre o clave" aria-label="Buscar deudor" autocomplete="off">
        <select id="ddBeneficio" aria-label="Filtrar por beneficio">
            <option value="">Todos los beneficios y rifas</option>
        </select>
        <span id="ddContador" class="dd-contador"></span>
    </div>

    <div class="dd-tabla-caja">
        <div id="ddEstado" class="dd-estado">Cargando deudores…</div>
        <table id="ddTabla" hidden>
            <thead>
                <tr>
                    <th class="dd-num">N°</th>
                    <th>Clave</th>
                    <th>Voluntario</th>
                    <th>Beneficio o rifa</th>
                    <th>Debe</th>
                    <th class="dd-der">Deuda</th>
                </tr>
            </thead>
            <tbody id="ddFilas"></tbody>
        </table>
    </div>
</main>

<script>
(function () {
    let deudores = [];
    const $ = (id) => document.getElementById(id);
    const pesos = (n) => '$' + Math.round(n).toLocaleString('es-CL');
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const capital = (t) => t ? t[0].toUpperCase() + t.slice(1) : '';
    // Ignora mayúsculas y tildes al buscar
    const norm = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    const llaveGrupo = (d) => `${d.tipo}:${d.beneficio_id}`;

    function pintar() {
        const q = norm($('ddBuscar').value.trim());
        const grupo = $('ddBeneficio').value;
        const filas = deudores.filter((d) =>
            (!grupo || llaveGrupo(d) === grupo) &&
            (!q || norm(`${d.voluntario_nombre} ${d.voluntario_clave}`).includes(q)));

        const total = filas.reduce((s, d) => s + d.monto_pendiente, 0);
        $('ddContador').textContent = filas.length === deudores.length
            ? `${filas.length} deudas`
            : `${filas.length} de ${deudores.length} deudas · ${pesos(total)}`;

        if (!filas.length) {
            $('ddTabla').hidden = true;
            $('ddEstado').hidden = false;
            $('ddEstado').textContent = q ? `Nadie coincide con "${$('ddBuscar').value.trim()}".` : 'No hay deudores en este beneficio.';
            return;
        }
        $('ddEstado').hidden = true;
        $('ddTabla').hidden = false;
        $('ddFilas').innerHTML = filas.map((d, i) => `
            <tr>
                <td class="dd-num">${i + 1}</td>
                <td class="dd-clave">${esc(d.voluntario_clave)}</td>
                <td class="dd-nombre">${esc(d.voluntario_nombre)}</td>
                <td>${esc(capital(d.beneficio_nombre))}</td>
                <td class="dd-suave">${esc(d.debe || d.tarjetas_asignadas || '')}</td>
                <td class="dd-der dd-monto">${pesos(d.monto_pendiente)}</td>
            </tr>`).join('');

        // El PDF sigue al filtro cuando se elige un beneficio
        const [tipo, id] = grupo.split(':');
        $('btnPDF').href = grupo && tipo === 'beneficio'
            ? `/api/voluntarios/pdf-deudores-beneficios/?beneficio_id=${id}`
            : '/api/voluntarios/pdf-deudores-beneficios/';
    }

    async function cargar() {
        try {
            const res = await fetch('/api/voluntarios/deudores-beneficios-listado/', { credentials: 'include' });
            const data = await res.json();
            if (!res.ok || !data.success) throw new Error(data.error || 'No se pudo cargar');
            deudores = data.deudores.map((d) => ({ ...d, monto_pendiente: Number(d.monto_pendiente || 0) }));

            if (!deudores.length) {
                $('ddEstado').textContent = 'No hay deudores de beneficios. Todos están al día.';
                $('ddEstado').classList.add('is-ok');
                return;
            }

            // Resumen y filtro por beneficio (con conteo y monto de cada uno)
            const grupos = new Map();
            deudores.forEach((d) => {
                const g = grupos.get(llaveGrupo(d)) || { nombre: capital(d.beneficio_nombre), n: 0, monto: 0 };
                g.n += 1; g.monto += d.monto_pendiente;
                grupos.set(llaveGrupo(d), g);
            });
            $('ddTotalDeudores').textContent = new Set(deudores.map((d) => d.voluntario_id)).size;
            $('ddTotalDeuda').textContent = pesos(deudores.reduce((s, d) => s + d.monto_pendiente, 0));
            $('ddChips').innerHTML = [...grupos.values()].map((g) => `<span>${esc(g.nombre)} <b>${g.n}</b> · ${pesos(g.monto)}</span>`).join('');
            $('ddResumen').hidden = false;
            $('ddBeneficio').insertAdjacentHTML('beforeend',
                [...grupos.entries()].map(([k, g]) => `<option value="${esc(k)}">${esc(g.nombre)} (${g.n})</option>`).join(''));
            pintar();
        } catch (err) {
            $('ddEstado').textContent = 'Error al cargar los deudores: ' + err.message;
        }
    }

    let t;
    $('ddBuscar').addEventListener('input', () => { clearTimeout(t); t = setTimeout(pintar, 150); });
    $('ddBeneficio').addEventListener('change', pintar);
    cargar();
})();
</script>
</body>
</html>
