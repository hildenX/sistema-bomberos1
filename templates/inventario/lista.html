{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario del Pañol - Sistema Bomberos</title>
    <style>
        body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #0e0e0e; color: #f0f0f0; }
        .inv-wrap { max-width: 1200px; margin: 0 auto; padding: 0 0 60px; }

        .inv-header {
            background: linear-gradient(135deg, #c41e3a 0%, #8b1429 100%);
            color: white; padding: 28px 32px; border-radius: 0 0 24px 24px;
            margin-bottom: 24px; box-shadow: 0 6px 28px rgba(196,30,58,0.35);
            display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px;
        }
        .inv-titulo { font-size: 1.65rem; font-weight: 800; margin: 0 0 5px; }
        .inv-subtitulo { margin: 0; opacity: 0.75; font-size: 0.875rem; }
        .inv-header-btns { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn-inv {
            padding: 9px 18px; border: none; border-radius: 8px; cursor: pointer;
            font-size: 0.875rem; font-weight: 600; transition: all .18s; white-space: nowrap;
        }
        .btn-inv.volver { background: rgba(255,255,255,0.18); color: white; border: 1px solid rgba(255,255,255,0.25); }
        .btn-inv.excel { background: #27ae60; color: white; }
        .btn-inv.excel:hover { background: #219150; }
        .btn-inv.nuevo { background: #2a2a2a; color: #f87171; border: 1px solid #333; }
        .btn-inv.nuevo:hover { background: #333; }
        .btn-inv.primary { background: #c41e3a; color: white; }
        .btn-inv.secondary { background: #2a2a2a; color: #ccc; border: 1px solid #333; }
        .btn-inv.danger { background: #7f1d1d; color: white; }
        .btn-inv.sm { padding: 5px 12px; font-size: 0.78rem; border-radius: 6px; }

        .inv-buscador { margin: 0 16px 20px; }
        .inv-buscador input {
            width: 100%; padding: 12px 16px; border: 1px solid #2a2a2a; border-radius: 10px;
            background: #1a1a1a; color: #f0f0f0; font-size: 0.9rem; box-sizing: border-box;
        }

        .inv-categoria { margin: 0 16px 24px; }
        .inv-categoria-titulo {
            background: linear-gradient(135deg, #c41e3a 0%, #8b1429 100%);
            color: white; padding: 12px 18px; border-radius: 10px 10px 0 0;
            font-weight: 700; font-size: 1rem;
        }
        .inv-tabla-wrap { background: #1c1c1c; border: 1px solid #2a2a2a; border-top: none; border-radius: 0 0 10px 10px; overflow-x: auto; }
        .inv-tabla { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .inv-tabla th {
            background: #161616; padding: 10px 12px; text-align: left; color: #999;
            font-weight: 700; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.5px;
            border-bottom: 1px solid #2a2a2a;
        }
        .inv-tabla td { padding: 10px 12px; border-bottom: 1px solid #2a2a2a; color: #f0f0f0; }
        .inv-tabla tr:last-child td { border-bottom: none; }
        .inv-tabla tr:hover td { background: #222; }

        .inv-badge-estado { padding: 3px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 700; }
        .inv-badge-estado.bueno { background: rgba(39,174,96,0.15); color: #4ade80; }
        .inv-badge-estado.regular { background: rgba(200,148,42,0.15); color: #fbbf24; }
        .inv-badge-estado.malo { background: rgba(192,57,43,0.15); color: #f87171; }

        .inv-empty { text-align: center; padding: 60px 20px; color: #888; }

        .inv-modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
            align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        }
        .inv-modal-box {
            background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 16px;
            width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .inv-modal-header {
            background: linear-gradient(135deg, #c41e3a 0%, #8b1429 100%);
            color: white; padding: 18px 22px; border-radius: 16px 16px 0 0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .inv-modal-body { padding: 22px; }
        .inv-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .inv-form-group { margin-bottom: 14px; }
        .inv-form-group.full { grid-column: 1 / -1; }
        .inv-form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #999; margin-bottom: 5px; }
        .inv-form-group input, .inv-form-group select, .inv-form-group textarea {
            width: 100%; padding: 9px 12px; border: 1px solid #2a2a2a; border-radius: 8px;
            font-size: 0.88rem; background: #1a1a1a; color: #f0f0f0; box-sizing: border-box;
        }
        .inv-modal-footer { display: flex; gap: 10px; justify-content: flex-end; padding: 0 22px 22px; }

        .inv-notif { margin: 0 16px 16px; padding: 12px 18px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; display: none; }
        .inv-notif.ok { background: rgba(39,174,96,0.12); color: #4ade80; border: 1px solid rgba(39,174,96,0.3); }
        .inv-notif.err { background: rgba(192,57,43,0.12); color: #fca5a5; border: 1px solid rgba(192,57,43,0.3); }
    </style>
    <link rel="stylesheet" href="{% static 'css/global-dark.css' %}?v=7">
</head>
<body>
<div class="inv-wrap">
    <div class="inv-header">
        <div>
            <h1 class="inv-titulo">Inventario del Pañol</h1>
            <p class="inv-subtitulo">Equipo y suministros de bodega — a cargo de Miguel Vásquez</p>
        </div>
        <div class="inv-header-btns">
            <button class="btn-inv volver" onclick="window.location.href='/sistema.html'">← Volver</button>
            <button class="btn-inv excel" onclick="inventario.exportarExcel()">Descargar Excel</button>
            <button class="btn-inv nuevo" id="btnNuevoItem" style="display:none" onclick="inventario.abrirModalNuevo()">+ Agregar Item</button>
        </div>
    </div>

    <div id="invNotif" class="inv-notif"></div>

    <div class="inv-buscador">
        <input type="text" id="invBuscador" placeholder="Buscar por nombre, categoría o marca..." oninput="inventario.filtrar(this.value)">
    </div>

    <div id="invListado"></div>
</div>

<!-- MODAL NUEVO/EDITAR ITEM -->
<div id="invModal" class="inv-modal-overlay" onclick="if(event.target===this) inventario.cerrarModal()">
    <div class="inv-modal-box">
        <div class="inv-modal-header">
            <h3 id="invModalTitulo">Nuevo Item</h3>
            <button class="btn-inv sm secondary" onclick="inventario.cerrarModal()">✕</button>
        </div>
        <form id="invForm" onsubmit="inventario.guardarItem(event)">
            <div class="inv-modal-body">
                <input type="hidden" id="invItemId">
                <div class="inv-form-grid">
                    <div class="inv-form-group full">
                        <label>Nombre *</label>
                        <input type="text" id="invNombre" required>
                    </div>
                    <div class="inv-form-group">
                        <label>Categoría</label>
                        <input type="text" id="invCategoria" placeholder="Ej: Mangueras/Pitones">
                    </div>
                    <div class="inv-form-group">
                        <label>Cantidad *</label>
                        <input type="number" id="invCantidad" step="0.01" required>
                    </div>
                    <div class="inv-form-group">
                        <label>Unidad</label>
                        <input type="text" id="invUnidad" placeholder="unidades, pares, cajas...">
                    </div>
                    <div class="inv-form-group">
                        <label>Marca</label>
                        <input type="text" id="invMarca">
                    </div>
                    <div class="inv-form-group">
                        <label>Tamaño / Volumen</label>
                        <input type="text" id="invTamano" placeholder="52mm, 6 litros c/u...">
                    </div>
                    <div class="inv-form-group">
                        <label>Estado</label>
                        <select id="invEstado">
                            <option value="">Sin especificar</option>
                            <option value="bueno">Bueno</option>
                            <option value="regular">Regular</option>
                            <option value="malo">Malo</option>
                        </select>
                    </div>
                    <div class="inv-form-group">
                        <label>N° de Serie</label>
                        <input type="text" id="invNumeroSerie">
                    </div>
                    <div class="inv-form-group">
                        <label>Responsable</label>
                        <input type="text" id="invResponsable" value="Miguel Vásquez">
                    </div>
                    <div class="inv-form-group">
                        <label>Ubicación</label>
                        <input type="text" id="invUbicacion" value="Pañol">
                    </div>
                    <div class="inv-form-group full">
                        <label>Observaciones</label>
                        <textarea id="invObservaciones" rows="3"></textarea>
                    </div>
                </div>
            </div>
            <div class="inv-modal-footer">
                <button type="button" class="btn-inv secondary" onclick="inventario.cerrarModal()">Cancelar</button>
                <button type="submit" class="btn-inv primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="{% static 'js/auth_django.js' %}"></script>
<script src="{% static 'js/utils.js' %}"></script>
<script src="{% static 'js/inventario-django.js' %}?v=1"></script>
</body>
</html>
